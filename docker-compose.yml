version: '3.8'

services:
  # =================================================================
  # 1. API GO (Backend)
  # =================================================================
  api:
    container_name: api_epi_prod
    restart: always
    build:
      context: ./gestao-de-epi--backEnd        # <-- Define que o build acontece dentro da pasta backend
      dockerfile: Dockerfile
    env_file:
      - ./gestao-de-epi--backEnd/.env      # <-- Lendo direto da pasta do back!
    expose:
      - "8080"              # Protegido: aberto só para a rede interna do Docker
    networks:
      - sge_network

  # =================================================================
  # 2. NGINX + FRONTEND REACT
  # =================================================================
  nginx:
    container_name: nginx_prod
    restart: always
    build:
      context: ./SGEPI-FRONT-END
      dockerfile: Dockerfile
    env_file:
      - ./SGEPI-FRONT-END/.env     # <-- Lendo as variáveis do front na hora do build
    ports:
      - "80:80"             # A porta pública que os clientes vão acessar
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sge_network

networks:
  sge_network:
    name: sge_prod_network
    driver: bridge